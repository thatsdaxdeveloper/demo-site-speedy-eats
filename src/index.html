<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedy Eats</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-white px-4 py-8 lg:px-12">
    <header class="flex justify-between items-center">
      <a href="#" class="flex items-center ">
        <img src="../assets/images/logo-speedy-eats.png" alt="Speedy Eats Logo" class="w-12 lg:w-16">
        <span class="text-md lg:text-xl font-bold text-red-600">Speedy Eats</span>
      </a>

      <nav aria-label="Navigation principale" class="hidden lg:block">
        <ul class="flex gap-14">
          <li><a href="#">Home</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Restaurants</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>

      <button type="button"
              class="hidden lg:block bg-black text-white px-4 py-2 rounded-3xl hover:bg-gray-700 cursor-pointer">Order
        Now
      </button>

      <button type="button"
              class="bg-black text-white text-sm lg:text-xl p-2 rounded-3xl hover:bg-gray-700 cursor-pointer flex items-center gap-2 lg:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                class="w-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
        Menu
      </button>
